<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRIMSON RPG</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #ff1a40;
            text-shadow: 0 0 10px rgba(255, 26, 64, 0.6);
        }
        .arena {
            background: #141414;
            border: 2px solid #33000a;
            padding: 20px;
            max-width: 400px;
            margin: 20px auto;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.2);
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .hp { color: #ff334b; }
        button {
            background: #260007;
            color: #ffccd5;
            border: 1px solid #ff1a40;
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
            font-family: inherit;
            border-radius: 4px;
            transition: 0.2s;
        }
        button:hover {
            background: #ff1a40;
            color: #fff;
            box-shadow: 0 0 8px #ff1a40;
        }
        #combat-log {
            margin-top: 20px;
            background: #050505;
            border: 1px solid #222;
            padding: 10px;
            height: 80px;
            overflow-y: auto;
            font-size: 0.9em;
            text-align: left;
            color: #b0b0b0;
        }
    </style>
</head>
<body>

    <h1>CRIMSON ABYSS</h1>
    
    <div class="arena">
        <h3>Arène de Combat</h3>
        <div class="stats">
            <div>Vous<br><span class="hp" id="player-hp">100</span>/100 PV</div>
            <div>Ombre<br><span class="hp" id="monster-hp">80</span>/80 PV</div>
        </div>

        <div>
            <button onclick="performAction('attack')">Attaquer</button>
            <button onclick="performAction('potion')">Boire Potion</button>
            <button onclick="resetCombat()">Recommencer</button>
        </div>

        <div id="combat-log">Un ennemi surgit des ténèbres... Préparez-vous.</div>
    </div>

    <script>
        let playerHp = 100;
        let monsterHp = 80;

        async function performAction(action) {
            if (playerHp <= 0 || monsterHp <= 0) return;

            try {
                const response = await fetch('/api/combat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ playerHp, monsterHp, action })
                });
                const data = await response.json();

                playerHp = data.playerHp;
                monsterHp = data.monsterHp;

                document.getElementById('player-hp').innerText = playerHp;
                document.getElementById('monster-hp').innerText = monsterHp;
                
                const logBox = document.getElementById('combat-log');
                logBox.innerHTML += `<br> > ${data.log}`;
                logBox.scrollTop = logBox.scrollHeight;

                if (playerHp <= 0) {
                    logBox.innerHTML += `<br><span style="color:red;"><b>Vous avez péri dans les ténèbres...</b></span>`;
                } else if (monsterHp <= 0) {
                    logBox.innerHTML += `<br><span style="color:#00ff66;"><b>Monstre vaincu ! Gloire au sang crimson.</b></span>`;
                }
            } catch (err) {
                console.error("Erreur de combat :", err);
            }
        }

        function resetCombat() {
            playerHp = 100;
            monsterHp = 80;
            document.getElementById('player-hp').innerText = playerHp;
            document.getElementById('monster-hp').innerText = monsterHp;
            document.getElementById('combat-log').innerHTML = "Le combat recommence. Affrontez l'ombre.";
        }
    </script>
</body>
</html>
