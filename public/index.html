<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRIMSON ABYSS</title>
    <style>
        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        body {
            background-color: #070505;
            color: #f6e4e4;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        h1 {
            color: #C24B4B;
            text-shadow: 0 0 12px rgba(194, 75, 75, 0.6);
            letter-spacing: 2px;
            margin-top: 40px;
            animation: fadeInScale 0.8s ease-out forwards;
        }

        .container {
            background: #170C0C;
            border: 2px solid #3C1A1A;
            padding: 30px;
            max-width: 420px;
            margin: 20px auto;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(194, 75, 75, 0.2);
            animation: fadeInScale 1s ease-out forwards;
        }

        select, button {
            background: #3C1A1A;
            color: #F6E4E4;
            border: 1px solid #C24B4B;
            padding: 12px;
            width: 100%;
            margin-top: 15px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            border-radius: 6px;
            transition: 0.2s;
        }

        select:hover, button:hover {
            background: #C24B4B;
            color: #fff;
            box-shadow: 0 0 10px #C24B4B;
        }

        .snake-btn {
            display: block;
            margin-top: 20px;
            background: #241618;
            color: #C24B4B;
            text-decoration: none;
            padding: 12px;
            border: 1px solid #C24B4B;
            border-radius: 6px;
            font-weight: bold;
            transition: 0.2s;
        }

        .snake-btn:hover {
            background: #C24B4B;
            color: #fff;
            box-shadow: 0 0 10px #C24B4B;
        }
    </style>
</head>
<body>

    <h1>CRIMSON ABYSS</h1>
    <div class="container">
        <p>Choisissez votre Shinobi</p>
        <select id="characterSelect">
            <!-- Rempli par le script -->
        </select>
        <button onclick="enterArena()">Entrer dans l'Arène</button>
        
        <!-- Bouton d'accès direct au mini-jeu de serpent -->
        <a href="/snake" class="snake-btn">JOUER AU CRIMSON SNAKE</a>
    </div>

    <script>
        async function loadCharacters() {
            try {
                const res = await fetch('/api/characters');
                const characters = await res.json();
                const select = document.getElementById('characterSelect');
                select.innerHTML = '';
                characters.forEach(char => {
                    const option = document.createElement('option');
                    option.value = char.id;
                    option.textContent = `${char.name} (${char.class}) - ATK: ${char.attackPower}`;
                    select.appendChild(option);
                });
            } catch (e) {
                console.error("Erreur de chargement des personnages", e);
            }
        }

        function enterArena() {
            const select = document.getElementById('characterSelect');
            const selectedId = select.value;
            window.location.href = `/arena.html?char=${selectedId}`;
        }

        loadCharacters();
    </script>
</body>
</html>
